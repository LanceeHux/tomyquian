<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Vault - Creator</title>
    <!-- Tailwind CSS v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .serif-font { font-family: 'Playfair Display', serif; }
    </style>
</head>
<body class="bg-[#0f0e11] text-[#e4e2e6] min-h-screen flex flex-col items-center py-12 px-4 selection:bg-[#d4af37]/30 selection:text-[#d4af37]">

    <div class="w-full max-w-2xl">
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 border-b border-[#2a2730] pb-4">
            <div>
                <h1 class="serif-font text-2xl font-semibold text-[#f4efdc]">Memory Vault</h1>
                <p class="text-xs text-[#9a95a0]">Write down thoughts as they come.</p>
            </div>
            <a href="view.html" target="_blank" class="text-xs px-4 py-2 rounded-lg bg-[#1f1d24] hover:bg-[#2a2730] text-[#d4af37] border border-[#d4af37]/20 transition-all">
                Preview View Page ↗
            </a>
        </header>

        <!-- Entry Form -->
        <form id="memoryForm" class="bg-[#17151b] border border-[#2a2730] rounded-2xl p-6 shadow-xl space-y-5">
            <div>
                <label class="block text-xs uppercase tracking-wider text-[#9a95a0] mb-2 font-medium">Date</label>
                <input type="date" id="entryDate" required class="w-full bg-[#0f0e11] border border-[#2a2730] rounded-xl px-4 py-3 text-sm text-[#e4e2e6] focus:outline-none focus:border-[#d4af37] transition-all">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-[#9a95a0] mb-2 font-medium">Title or Subject</label>
                <input type="text" id="entryTitle" placeholder="e.g., When it started raining today..." required class="w-full bg-[#0f0e11] border border-[#2a2730] rounded-xl px-4 py-3 text-sm text-[#e4e2e6] focus:outline-none focus:border-[#d4af37] transition-all">
            </div>

            <div>
                <label class="block text-xs uppercase tracking-wider text-[#9a95a0] mb-2 font-medium">Your Message / Diary Entry</label>
                <textarea id="entryContent" rows="6" placeholder="Write what's on your mind..." required class="w-full bg-[#0f0e11] border border-[#2a2730] rounded-xl p-4 text-sm text-[#e4e2e6] focus:outline-none focus:border-[#d4af37] transition-all resize-none"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full py-3 bg-[#d4af37] hover:bg-[#c29f30] text-[#0f0e11] font-semibold rounded-xl text-sm transition-all shadow-lg shadow-[#d4af37]/10">
                Save to Cloud Vault
            </button>
        </form>
    </div>

    <!-- Firebase SDK Modular Import -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // TODO: Replace with your actual Firebase project config credentials
        const firebaseConfig = {
          apiKey: "AIzaSyCc6v2TfSNFbjbdud9FkT8uTIvfxK2Z3yk",
          authDomain: "lanceehux-tomyquian.firebaseapp.com",
          projectId: "lanceehux-tomyquian",
          storageBucket: "lanceehux-tomyquian.firebasestorage.app",
          messagingSenderId: "693028932839",
          appId: "1:693028932839:web:29b7a804b7f55ac8642642"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Set default date to today
        document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];

        const form = document.getElementById('memoryForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = "Saving...";

            const date = document.getElementById('entryDate').value;
            const title = document.getElementById('entryTitle').value;
            const content = document.getElementById('entryContent').value;

            try {
                await addDoc(collection(db, "memories"), {
                    date: date,
                    title: title,
                    content: content,
                    createdAt: serverTimestamp()
                });
                alert("Saved successfully!");
                form.reset();
                document.getElementById('entryDate').value = new Date().toISOString().split('T')[0];
            } catch (error) {
                console.error("Error adding document: ", error);
                alert("Failed to save. Check console for details.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Save to Cloud Vault";
            }
        });
    </script>
</body>
</html>
